name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check lib/background-jobs.js
          node --check lib/deepseek.js
          node --check lib/fetcher.js
          node --check lib/request-ai-config.js
          node --check lib/sources.js
          node --check lib/store.js
          node --check scripts/refresh-worker.js
          node --check public/app.js

      - name: Run tests
        run: npm test

      - name: Build production image
        run: docker build --tag qmreader:ci .
