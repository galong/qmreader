<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>播客文稿 · QMReader</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/podscribe.css?v=1">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="back" href="/" aria-label="返回 QMReader" title="返回 QMReader"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7M19 12H5"/></svg></a>
      <span class="brand">QMReader <span>/ 播客文稿</span></span>
    </header>
    <section class="hero">
      <p class="eyebrow">PODCAST TRANSCRIPTS</p>
      <h1>从播客原声，到可读的文字</h1>
      <p>搜索节目或单集，阅读来源逐字稿。管理员可基于完整文稿生成中文「乔木转写」。</p>
      <form id="search-form" role="search">
        <label class="sr-only" for="query">搜索播客或单集</label>
        <input id="query" type="search" maxlength="200" required placeholder="搜索节目或单集，例如 All-In">
        <button type="submit" aria-label="搜索播客" title="搜索播客"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.34-4.34"/></svg></button>
      </form>
      <p id="status" role="status" aria-live="polite">输入关键词开始搜索。</p>
    </section>
    <div class="layout">
      <aside class="results" aria-label="搜索结果">
        <h2 id="results-title">搜索结果</h2>
        <div id="podcasts"></div>
        <div id="episodes"></div>
        <button id="next-page" class="next hidden" type="button">加载更多单集</button>
      </aside>
      <section class="detail" aria-label="播客文稿">
        <div id="empty" class="empty">选择一集播客，查看完整源文稿。</div>
        <div id="episode-detail" class="hidden">
          <p id="podcast-name" class="eyebrow"></p>
          <h2 id="episode-title"></h2>
          <div class="metadata"><a id="source-link" target="_blank" rel="noopener noreferrer">查看原始页面</a><span id="word-count"></span></div>
          <div class="tabs" role="tablist" aria-label="文稿类型">
            <button id="tab-source" class="active" type="button" role="tab" aria-selected="true">源文稿</button>
            <button id="tab-rewrite" type="button" role="tab" aria-selected="false">乔木转写</button>
          </div>
          <div id="source-panel" role="tabpanel"><p class="notice">以下内容来自原始播客文稿服务，可能含自动识别错误；未经过乔木编辑。</p><div id="source-text" class="transcript"></div></div>
          <div id="rewrite-panel" class="hidden" role="tabpanel"><p class="notice">中文内容由 AI 根据完整源文稿分段提炼生成，并非逐字翻译。请对照原文核实人名、数字和观点。</p><button id="rewrite-button" type="button">生成乔木转写</button><div id="rewrite-text" class="transcript"></div></div>
        </div>
      </section>
    </div>
    <footer>源文稿由播客原文服务提供。</footer>
  </main>
  <script src="/podscribe.js?v=6" defer></script>
</body>
</html>
