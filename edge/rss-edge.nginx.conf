server {
    listen 80;
    server_name rss-edge.qiaomu.ai;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/rss-edge.qiaomu.ai; }
    location / { return 301 https://rss-edge.qiaomu.ai$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name rss-edge.qiaomu.ai;
    ssl_certificate /etc/letsencrypt/live/rss-edge.qiaomu.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rss-edge.qiaomu.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1k;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "https://rss.qiaomu.ai" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Accept, X-Rss-List" always;
    add_header Vary "Origin, X-Rss-List" always;
    add_header X-Qiaomu-Read-Route "edge" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /healthz { default_type application/json; return 200 '{"service":"qiaomu-rss-read-edge","ok":true}'; }
    location ~ "^/api/(sources|entries|sources/[A-Za-z0-9_-]+/entries|entry/[A-Za-z0-9_-]+(/(rewrite|translation))?)$" {
        if ($request_method !~ "^(GET|OPTIONS)$") { return 405; }
        if ($http_authorization != "") { return 400; }
        if ($http_cookie != "") { return 400; }
        if ($args ~ "(^|&)(?!(limit|cursor|source|category|q|ready|summary|optIn)=)[^&]+") { return 404; }
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass http://127.0.0.1:3088;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host rss.qiaomu.ai;
        proxy_set_header Accept application/json;
        proxy_set_header Accept-Encoding $http_accept_encoding;
        proxy_set_header X-Rss-List $http_x_rss_list;
        proxy_set_header Content-Length "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 12s;
        proxy_send_timeout 12s;
    }
    location / { return 404; }
    access_log /www/wwwlogs/rss-edge.qiaomu.ai.log;
    error_log /www/wwwlogs/rss-edge.qiaomu.ai.error.log;
}
