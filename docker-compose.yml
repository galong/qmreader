services:
  qmreader:
    image: ${QMREADER_IMAGE:-qmreader:local}
    build:
      context: .
    container_name: qiaomu-qmreader
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
      TITLE_TRANSLATION_LIMIT: 80
    ports:
      - "127.0.0.1:3088:8080"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/sources').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
